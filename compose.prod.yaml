# Self-hosted: API + Postgres. Start with
#   docker compose -f compose.prod.yaml --env-file .env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drawdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: drawdb
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawdb"]
      interval: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://drawdb:${POSTGRES_PASSWORD}@db:5432/drawdb
      PORT: 5000
    ports:
      - ${SERVER_PORT:-5000}:5000
    depends_on:
      db:
        condition: service_healthy

  # Daily dumps into ./backups, kept two weeks
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: drawdb
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: drawdb
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
